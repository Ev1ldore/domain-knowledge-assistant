[assistant]
name = 知识问答助手
description = 依据你导入的常见问答与知识文档回答问题。
welcome = 你好，请描述你想了解的问题。我会依据已导入资料回答。
suggestions = []
insufficient_action = clarify
allow_general_chat = false

[storage]
max_upload_mb = 20
; 默认在项目 data/ 中建立独立 SQLite 与上传副本；也可用 ASSISTANT_DATA_DIR 覆盖。

[model]
llm_url = http://127.0.0.1:11434/v1
llm_model = qcwind/qwen3-8b-instruct-Q4-K-M:latest
embedding_url = http://127.0.0.1:11434/v1
embedding_model = bge-m3:latest
reranker_backend = cross_encoder
reranker_model = BAAI/bge-reranker-large
reranker_device = cpu
model_timeout = 180

[retrieval]
retrieval_k = 15
candidate_m = 3
similarity_threshold = 0.25
rerank_threshold = 0.5
chunk_size = 700
chunk_overlap = 80

[faq]
enabled = true
threshold = 0.90
margin = 0.15
